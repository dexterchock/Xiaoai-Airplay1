general = {
  name = "XIAOAI";
  // password = "secret"; // Uncomment on speaker to require an AirPlay 1 password
  output_backend = "alsa";
  mdns_backend = "dns-sd";
  interface = "wlan0";
  interpolation = "soxr";
  volume_range_db = 60;
  volume_control_profile = "dasl_tapered";
  drift_tolerance_in_seconds = 0.002;
  resync_threshold_in_seconds = 0.050;
  audio_backend_buffer_desired_length_in_seconds = 0.08;
  audio_backend_buffer_interpolation_threshold_in_seconds = 0.04;
};

alsa = {
  output_device = "dsp";
  output_rate = 48000;
  output_format = "S16_LE";
  output_channels = 2;
  use_mmap_if_available = "no";
};

sessioncontrol = {
  allow_session_interruption = "yes";
  session_timeout = 60;
  active_state_timeout = 10.0;
  wait_for_completion = "no";
  run_this_before_entering_active_state = "/data/xiaoai-airplay1/airplay-hook.sh start";
  run_this_after_exiting_active_state = "/data/xiaoai-airplay1/airplay-hook.sh stop";
};
